name: Status check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require STATUS.md when application code changes
        env:
          STATUS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: npm run status:check
