<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>36Blocks — Secure Auth &amp; User Management for Modern Apps</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#315b2b" />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="36Blocks" />
        <link rel="canonical" href="https://36blocks.com/" />
        <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
        <link
            rel="preload"
            href="/assets/images/36-blocks-logo.svg"
            as="image"
            type="image/svg+xml"
            fetchpriority="high"
        />
    </head>
    <body>
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('ui-settings');
                    var preference = 'light';
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        var ttl = 30 * 24 * 60 * 60 * 1000;
                        if (parsed && typeof parsed._savedAt === 'number' && Date.now() - parsed._savedAt < ttl) {
                            if (
                                parsed.themePreference === 'light' ||
                                parsed.themePreference === 'dark' ||
                                parsed.themePreference === 'system'
                            ) {
                                preference = parsed.themePreference;
                            } else if (parsed.theme === 'dark-theme') {
                                preference = 'dark';
                            } else if (parsed.theme === 'light-theme') {
                                preference = 'light';
                            }
                        }
                    }
                    var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var dark = preference === 'dark' || (preference === 'system' && systemDark);
                    document.body.classList.remove('light-theme', 'dark-theme');
                    document.body.classList.add(dark ? 'dark-theme' : 'light-theme');
                } catch (e) {}
            })();
        </script>
        <div id="app-splash-screen">
            <style>
                #app-splash-screen {
                    position: fixed;
                    inset: 0;
                    z-index: 99999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: var(--color-common-bg) !important;
                    transition: opacity 0.25s ease;
                }
                #app-splash-screen.splash-hidden {
                    opacity: 0;
                    pointer-events: none;
                }
                .splash-logo {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    gap: 20px;
                }
                .splash-spinner {
                    width: 42px;
                    height: 42px;
                    border: 3px solid rgba(255, 255, 255, 0.12);
                    border-top-color: var(--mat-sys-primary);
                    border-radius: 50%;
                    animation: splash-spin 0.7s linear infinite;
                }
                @keyframes splash-spin {
                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
            <div class="splash-logo">
                <div class="splash-spinner"></div>
            </div>
        </div>
        <proxy-root></proxy-root>
    </body>
</html>
