<nav aria-label="Workspace navigation" class="workspace-navigation">
    <span class="nav-section" [class.hidden]="isSideNavOpen()">WORKSPACE</span>
    @for (item of navItems; track item.route) {
        <a
            [routerLink]="['/app', item.route]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [matTooltip]="isSideNavOpen() ? item.label : ''"
            matTooltipPosition="right"
            [attr.aria-label]="item.label"
            ><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon
            ><span [class.hidden]="isSideNavOpen()">{{ item.label }}</span></a
        >
    }
    <a class="nav-docs" href="https://developers.36blocks.com" [attr.aria-label]="'Developer documentation'"
        ><mat-icon aria-hidden="true">menu_book</mat-icon
        ><span [class.hidden]="isSideNavOpen()">Developer docs ↗</span></a
    >
</nav>
